# Réglages Netlify : site statique, aucune étape de construction.
[build]
  publish = "."
  command = ""

# Le contenu et le PDF changent souvent : le navigateur revérifie à chaque visite.
[[headers]]
  for = "/contenu.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/portfolio.pdf"
  [headers.values]
    Cache-Control = "no-cache"

# Le tableau de bord ne doit pas apparaître dans Google.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
